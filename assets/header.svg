<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">RinoNRC — Python, desktop apps and clean interfaces</title>
  <desc id="desc">Minimal dark banner with turquoise accents and a gently pulsing terminal cursor.</desc>
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(1000 145) rotate(145) scale(510 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="64" y1="0" x2="1136" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typing"><rect class="typing-window" x="88" y="270" width="300" height="22"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8B949E" fill-opacity=".10"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .typing-window { width: 300px; animation: type 12s steps(30, end) infinite; }
      .typing-caret { transform: translateX(300px); animation: caret 12s steps(30, end) infinite; }
      @keyframes type { 0%,8%,100% { width: 0; } 42%,78% { width: 300px; } 94% { width: 0; } }
      @keyframes caret { 0%,8%,100% { transform: translateX(0); } 42%,78% { transform: translateX(300px); } 94% { transform: translateX(0); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
      .ambient { animation: breathe 9s ease-in-out infinite; }
      .scanner { stroke-dasharray: 100 970; animation: scan 8s ease-in-out infinite; }
      .terminal { transform-box: fill-box; transform-origin: center; animation: float 7s ease-in-out infinite; }
      .status { animation: blink 3s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes scan { 0% { stroke-dashoffset: 120; opacity: 0; } 15%,80% { opacity: .9; } 100% { stroke-dashoffset: -1070; opacity: 0; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { .cursor,.ambient,.scanner,.terminal,.status,.typing-window,.typing-caret { animation: none; } .typing-window { width: 300px; } .scanner { display: none; } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="339" rx="20" fill="#0D1117" stroke="#212B36"/>
  <rect class="ambient" x="1" y="1" width="1198" height="338" rx="20" fill="url(#ambient)"/>
  <path d="M800 32H1168V308H800Z" fill="url(#grid)"/>
  <circle cx="66" cy="58" r="4" fill="#2DD4BF"/>
  <text x="82" y="63" class="mono" font-size="13" letter-spacing="2" fill="#8B949E">RINONRC / GITHUB</text>
  <text x="62" y="165" class="sans" font-size="76" font-weight="700" letter-spacing="-3" fill="#E6EDF3">RinoNRC<tspan fill="#2DD4BF">.</tspan></text>
  <text x="66" y="211" class="mono" font-size="18" fill="#B1BAC4">Python. Desktop apps. Clean interfaces.</text>
  <path d="M66 247H1134" stroke="url(#line)" stroke-opacity=".65"/>
  <path class="scanner" d="M66 247H1134" stroke="#71f0dc" stroke-width="1.5"/>
  <text x="66" y="286" class="mono" font-size="14" fill="#2DD4BF">&gt;</text>
  <text x="88" y="286" class="mono" font-size="14" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#8B949E" clip-path="url(#typing)">small details. useful software.</text>
  <g class="typing-caret"><rect class="cursor" x="90" y="273" width="8" height="16" rx="1" fill="#2DD4BF"/></g>
  <g transform="translate(948 105)"><g class="terminal" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="150" height="112" rx="14" fill="#0D171E" stroke="#24474A" stroke-width="1"/>
    <path d="M24 40L43 56L24 72M59 72H85"/>
    <circle class="status" cx="122" cy="25" r="3" fill="#2DD4BF" stroke="none"/>
  </g></g>
</svg>
