<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">RinoNRC — Python, desktop apps and clean interfaces</title>
  <desc id="desc">Minimal dark banner with turquoise accents and a gently pulsing terminal cursor.</desc>
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(1000 145) rotate(145) scale(510 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="64" y1="0" x2="1136" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8B949E" fill-opacity=".10"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .cursor { animation: blink 1.8s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="339" rx="20" fill="#0D1117" stroke="#212B36"/>
  <rect x="1" y="1" width="1198" height="338" rx="20" fill="url(#ambient)"/>
  <path d="M800 32H1168V308H800Z" fill="url(#grid)"/>
  <circle cx="66" cy="58" r="4" fill="#2DD4BF"/>
  <text x="82" y="63" class="mono" font-size="13" letter-spacing="2" fill="#8B949E">RINONRC / GITHUB</text>
  <text x="62" y="165" class="sans" font-size="76" font-weight="700" letter-spacing="-3" fill="#E6EDF3">RinoNRC<tspan fill="#2DD4BF">.</tspan></text>
  <text x="66" y="211" class="mono" font-size="18" fill="#B1BAC4">Python. Desktop apps. Clean interfaces.</text>
  <path d="M66 247H1134" stroke="url(#line)" stroke-opacity=".65"/>
  <text x="66" y="286" class="mono" font-size="14" fill="#2DD4BF">&gt; <tspan fill="#8B949E">small details. useful software.</tspan></text>
  <rect class="cursor" x="414" y="273" width="8" height="16" rx="1" fill="#2DD4BF"/>
  <g transform="translate(948 105)" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="150" height="112" rx="14" fill="#0D171E" stroke="#24474A" stroke-width="1"/>
    <path d="M24 40L43 56L24 72M59 72H85"/>
    <circle cx="122" cy="25" r="3" fill="#2DD4BF" stroke="none"/>
  </g>
</svg>
